<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nail Studio image references</title><style>body{font:16px system-ui;margin:32px;background:#f8f4f0;color:#302c34}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}article{background:white;padding:16px;border-radius:12px}img{width:100%;height:180px;object-fit:contain}a{color:#713f60}</style><p><a href="studio/">Open Nail Art Studio: polishes, plates and design tools</a></p><h1>Nail Studio image references</h1><p>Product and swatch references. <a href="manifest.json">Image lookup manifest</a></p><input id="search" type="search" placeholder="Find a polish" aria-label="Find a polish"><p id="status"></p><main class="grid" id="images"></main><script>
fetch('manifest.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(items=>{function render(){const q=document.querySelector('#search').value.toLowerCase();const rows=items.filter(x=>x.images.length&&x.name.toLowerCase().includes(q));const main=document.querySelector('#images');main.replaceChildren();document.querySelector('#status').textContent=rows.length+' polishes';for(const row of rows){const card=document.createElement('article');const title=document.createElement('h2');title.textContent=row.name;card.append(title);for(const photo of row.images){const a=document.createElement('a');a.href=photo.url;const img=document.createElement('img');img.src=photo.url;img.alt=photo.caption;img.loading='lazy';a.append(img);card.append(a)}main.append(card)}}document.querySelector('#search').oninput=render;render()}).catch(()=>document.querySelector('#status').textContent='Image manifest unavailable.');
</script></html>
